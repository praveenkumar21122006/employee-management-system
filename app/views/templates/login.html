<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — EMS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap'); body{font-family:'Inter',sans-serif}</style>
</head>
<body class="bg-[#f8fafc] min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md">
  <div class="bg-white rounded-2xl border shadow-sm p-8">
    <div class="text-center mb-6">
      <div class="w-12 h-12 bg-indigo-600 rounded-xl flex items-center justify-center text-white mx-auto mb-3"><i class="fa-solid fa-users"></i></div>
      <h1 class="text-xl font-bold">Welcome back</h1>
      <p class="text-sm text-slate-500">Sign in to Employee Management System</p>
    </div>

    <div id="alert" class="hidden mb-4 px-4 py-3 rounded-lg text-sm"></div>

    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="text-xs font-semibold uppercase text-slate-600">Email</label>
        <input id="email" type="email" required placeholder="admin@ems.local" class="mt-1 w-full px-3 py-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>
      <div>
        <label class="text-xs font-semibold uppercase text-slate-600">Password</label>
        <input id="password" type="password" required placeholder="••••••••" class="mt-1 w-full px-3 py-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>
      <button type="submit" id="btn" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium transition">
        <i class="fa-solid fa-right-to-bracket mr-2"></i>Sign In
      </button>
    </form>



    <p class="text-center text-sm text-slate-500 mt-6">No account? <a href="/register" class="text-indigo-600 font-medium hover:underline">Register as Employee</a></p>
  </div>
  <p class="text-center text-xs text-slate-400 mt-4">EMS • Flask + SQLite • Session Auth • Role-based</p>
</div>
<script>
function fill(e,p){document.getElementById('email').value=e;document.getElementById('password').value=p;}
function showAlert(msg,type){
  const a=document.getElementById('alert');
  a.textContent=msg; a.classList.remove('hidden');
  a.className='mb-4 px-4 py-3 rounded-lg text-sm ' + (type==='error' ? 'bg-red-50 border border-red-200 text-red-700' : 'bg-emerald-50 border border-emerald-200 text-emerald-700');
}
async function handleLogin(ev){
  ev.preventDefault();
  const btn=document.getElementById('btn'); btn.disabled=true; btn.textContent='Signing in...';
  const payload={email:document.getElementById('email').value.trim(), password:document.getElementById('password').value};
  try{
    const res=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(payload)});
    const data=await res.json();
    if(!res.ok){ showAlert(data.error||'Login failed','error'); btn.disabled=false; btn.innerHTML='<i class=\"fa-solid fa-right-to-bracket mr-2\"></i>Sign In'; return;}
    showAlert('Login successful! Redirecting...','success');
    setTimeout(()=> location.href='/', 600);
  }catch(e){ showAlert('Network error','error'); btn.disabled=false; btn.innerHTML='<i class=\"fa-solid fa-right-to-bracket mr-2\"></i>Sign In';}
}
</script>
</body>
</html>
