<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — EMS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap'); body{font-family:'Inter',sans-serif}</style>
</head>
<body class="bg-[#f8fafc] min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-xl">
  <div class="bg-white rounded-2xl border shadow-sm p-8">
    <div class="text-center mb-6">
      <div class="w-12 h-12 bg-indigo-600 rounded-xl flex items-center justify-center text-white mx-auto mb-3"><i class="fa-solid fa-user-plus"></i></div>
      <h1 class="text-xl font-bold">Create Employee Account</h1>
      <p class="text-sm text-slate-500">Self-registration creates an <span class="font-semibold text-emerald-700">Employee</span> account. Admins can upgrade roles.</p>
    </div>
    <div id="alert" class="hidden mb-4 px-4 py-3 rounded-lg text-sm"></div>

    <form id="regForm" onsubmit="handleRegister(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div><label class="text-xs font-semibold uppercase text-slate-600">First Name *</label><input id="first_name" required class="mt-1 w-full px-3 py-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></div>
      <div><label class="text-xs font-semibold uppercase text-slate-600">Last Name *</label><input id="last_name" required class="mt-1 w-full px-3 py-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></div>
      <div><label class="text-xs font-semibold uppercase text-slate-600">Email *</label><input id="email" type="email" required class="mt-1 w-full px-3 py-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></div>
      <div><label class="text-xs font-semibold uppercase text-slate-600">Password *</label><input id="password" type="password" required minlength="6" placeholder="min 6 chars" class="mt-1 w-full px-3 py-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></div>
      <div><label class="text-xs font-semibold uppercase text-slate-600">Phone</label><input id="phone" class="mt-1 w-full px-3 py-2.5 border rounded-lg text-sm"></div>
      <div><label class="text-xs font-semibold uppercase text-slate-600">Salary *</label><input id="salary" type="number" min="1" required value="55000" class="mt-1 w-full px-3 py-2.5 border rounded-lg text-sm"></div>
      <div><label class="text-xs font-semibold uppercase text-slate-600">Department</label><select id="department_id" class="mt-1 w-full px-3 py-2.5 border rounded-lg text-sm bg-white"><option value="">— None —</option></select></div>
      <div><label class="text-xs font-semibold uppercase text-slate-600">Hire Date</label><input id="hire_date" type="date" class="mt-1 w-full px-3 py-2.5 border rounded-lg text-sm"></div>
      <div class="md:col-span-2">
        <button type="submit" id="btn" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium">Create Account</button>
      </div>
    </form>
    <p class="text-center text-sm text-slate-500 mt-6">Already have an account? <a href="/login" class="text-indigo-600 font-medium hover:underline">Sign in</a></p>
  </div>
</div>
<script>
async function loadDepts(){
  try{
    const r=await fetch('/departments',{credentials:'same-origin'});
    if(r.ok){
      const j=await r.json();
      const sel=document.getElementById('department_id');
      (j.departments||[]).forEach(d=>{
        const o=document.createElement('option'); o.value=d.id; o.textContent=d.department_name; sel.appendChild(o);
      });
    } else {
      // Fallback hardcoded if API fails (e.g., DB not ready)
      const fallback=['Engineering','Human Resources','Marketing','Finance'];
      const sel=document.getElementById('department_id');
      fallback.forEach((name,idx)=>{
        const o=document.createElement('option'); o.value=idx+1; o.textContent=name; sel.appendChild(o);
      });
      console.warn('Departments fetch failed, using fallback');
    }
  }catch(e){
    const fallback=['Engineering','Human Resources','Marketing','Finance'];
    const sel=document.getElementById('department_id');
    fallback.forEach((name,idx)=>{
      const o=document.createElement('option'); o.value=idx+1; o.textContent=name; sel.appendChild(o);
    });
  }
}
loadDepts();
function showAlert(msg,type){
  const a=document.getElementById('alert');
  a.textContent=msg; a.classList.remove('hidden');
  a.className='mb-4 px-4 py-3 rounded-lg text-sm ' + (type==='error' ? 'bg-red-50 border border-red-200 text-red-700' : 'bg-emerald-50 border border-emerald-200 text-emerald-700');
}
async function handleRegister(ev){
  ev.preventDefault();
  const btn=document.getElementById('btn'); btn.disabled=true; btn.textContent='Creating...';
  const payload={
    first_name:document.getElementById('first_name').value.trim(),
    last_name:document.getElementById('last_name').value.trim(),
    email:document.getElementById('email').value.trim(),
    password:document.getElementById('password').value,
    phone:document.getElementById('phone').value.trim()||null,
    salary:parseFloat(document.getElementById('salary').value),
    department_id: document.getElementById('department_id').value ? parseInt(document.getElementById('department_id').value): null,
    hire_date: document.getElementById('hire_date').value || undefined,
    role:'Employee'
  };
  try{
    const res=await fetch('/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(payload)});
    const data=await res.json();
    if(!res.ok){ showAlert((data.error||'Failed') + (data.details?': '+JSON.stringify(data.details):''),'error'); btn.disabled=false; btn.textContent='Create Account'; return;}
    showAlert('Account created! Redirecting to dashboard...','success');
    setTimeout(()=> location.href='/', 800);
  }catch(e){ showAlert('Network error','error'); btn.disabled=false; btn.textContent='Create Account';}
}
</script>
</body>
</html>
